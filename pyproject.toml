[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-agent"
version = "0.1.0"
description = "Build a Fantasy Premier League squad from the public FPL API, with r/FantasyPL sentiment analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# PuLP gives a provably optimal squad; without it a local search is used.
# Capped below 3.0: PuLP 3.x/4.x rewrote the API on a Rust core and dropped
# LpVariable.dicts() and the classic LpVariable(name, cat=...) constructor
# that optimizer.py relies on, so solving breaks and silently falls back to
# local search (with a log warning) under the new major versions.
solver = ["pulp>=2.7,<3"]
dev = ["pytest>=7.0", "pulp>=2.7,<3"]

[project.scripts]
fpl-agent = "fpl_agent.cli:main"

[tool.setuptools.packages.find]
include = ["fpl_agent*"]

[tool.setuptools.package-data]
fpl_agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
